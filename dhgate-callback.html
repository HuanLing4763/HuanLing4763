<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>授权回调转发</title>
</head>
<body>
    <script>
        // 1. 从 URL 中解析 code 和 state 参数
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const state = params.get('state'); // state 中可包含本地服务地址（如之前的 localhost:8080）

        // 2. 确定要转发的本地服务地址（从 state 中解析，或硬编码测试）
        // （如果 state 是 Base64 编码的本地地址，这里需要解码，和之前逻辑一致）
        let localHost = 'http://localhost:8080'; 
        try {
            // 尝试从 state 解码本地服务地址（兼容之前的编码逻辑）
            const decodedState = atob(state.replace(/-/g, '+').replace(/_/g, '/'));
            if (decodedState.startsWith('http://') || decodedState.startsWith('https://')) {
                localHost = decodedState;
            }
        } catch (e) {
            console.log('state 解码失败，使用默认本地地址');
        }

        // 3. 转发参数到本地服务的 /receive_code 接口
        const forwardUrl = new URL('/receive_code', localHost);
        if (code) forwardUrl.searchParams.append('code', code);
        if (error) forwardUrl.searchParams.append('error', error);

        // 4. 发送请求（用 fetch 或 img 标签，避免跨域限制）
        const img = new Image();
        img.src = forwardUrl.toString(); // 用 img 标签发送 GET 请求，兼容性更好

        // 5. 显示提示信息
        document.body.innerHTML = `
            <h3>授权回调处理中...</h3>
            <p>code: ${code || '无'}</p>
            <p>已转发到本地服务：${localHost}</p>
            <p>3秒后自动关闭窗口</p>
        `;
        setTimeout(() => window.close(), 3000);
    </script>
</body>
</html>
